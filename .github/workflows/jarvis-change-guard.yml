name: Jarvis coding change guard
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  guard:
    # This bounded-diff guard is for generated coding patches only. Integration
    # branches can legitimately add workflows and coordinated test coverage.
    if: startsWith(github.head_ref, 'jarvis/coding/') || startsWith(github.head_ref, 'jarvis-coding-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test guard behavior
        run: node scripts/test-jarvis-guard-diff.mjs
      - name: Inspect Jarvis proposed diff
        env:
          JARVIS_BASE_REF: origin/main
        run: node scripts/jarvis-guard-diff.mjs
