name: Jarvis scheduled read-only executor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-scheduled-execution
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate scheduled executor
        run: node scripts/test-jarvis-scheduled-worker.mjs
      - name: Run one due approved task
        env:
          JARVIS_ACTOR: jarvis-scheduled-execution
          JARVIS_QUEUE_PATH: ${{ runner.temp }}/jarvis-queue.json
          JARVIS_RESULTS_DIR: ${{ runner.temp }}/jarvis-results
        run: |
          printf '[]\n' > "$JARVIS_QUEUE_PATH"
          node scripts/jarvis-scheduled-worker.mjs
