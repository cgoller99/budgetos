name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run calculation tests
        run: |
          npm run test:finance-calculations
          npm run test:p1-financial-accuracy
          npm run test:income-plan-link
          npm run test:sts-metric-contract
          npm run test:cash-outlook
          npm run test:cash-flow-forecast
          npm run test:budget-frequencies
          npm run test:budget-hub-goals
          npm run test:unified-financial-plan
          npm run test:category-budgets
          npm run test:goal-forecast
          npm run test:income-annualization
          npm run test:income-pay-dates
          npm run test:paycheck-goal-allocations
          npm run test:alias-hook
          npm run test:subscription-lifecycle
          npm run test:debt-payoff
          npm run test:household-member-rls
          npm run test:ios-ui-21
          npm run test:home-net-worth-first
          npm run test:stage4-premium-home
          npm run test:ios-bills-sheet
          npm run test:bills-edit-remove
          npm run test:bills-delete-button
          npm run test:onboarding-progress
          npm run test:plaid-credit-mapping
          npm run test:recurring-bill-detection
          npm run test:profile-privilege-guard
          npm run test:beta-registration
